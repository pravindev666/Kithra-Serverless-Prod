# Dev/reference topology. Harden before production: secrets manager, private networks, TLS, backups, host monitoring.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kithra
      POSTGRES_USER: kithra
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kithra -d kithra']
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:7-alpine
    command: ['redis-server','--appendonly','yes']
    volumes: [redis_data:/data]
    restart: unless-stopped
    networks: [backend]
  api:
    build: {context: ../../.., dockerfile: infra/server/Dockerfile.api}
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
  jobs:
    build: {context: ../../.., dockerfile: infra/server/Dockerfile.jobs}
    depends_on: [postgres, redis]
    networks: [backend]
    restart: unless-stopped
  web:
    build: {context: ../../.., dockerfile: infra/server/Dockerfile.web}
    networks: [edge]
    restart: unless-stopped
  admin:
    build: {context: ../../.., dockerfile: infra/server/Dockerfile.admin}
    networks: [edge]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web, admin]
    networks: [backend, edge]
    restart: unless-stopped
volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
networks:
  edge: {}
  backend: {internal: true}
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt # create securely outside VCS, production should use managed secrets
